# Default API Keys for Development
# These are placeholder values for developers who don't have their own API keys yet
# Replace these with your own keys from:
# - Google Cloud Console: https://console.cloud.google.com
# - Firebase Console: https://console.firebase.google.com

# Google Maps API Key
# Create one at: https://console.cloud.google.com/google/maps-apis/
# Enable Maps SDK for Android in your project
# Create a key with Android app restrictions
GOOGLE_MAPS_API_KEY=YOUR_GOOGLE_MAPS_API_KEY_HERE

# Release signing configuration (for production builds only)
# Don't commit your actual values - use local.properties instead
RELEASE_STORE_FILE=~/production.keystore
RELEASE_STORE_PASSWORD=password_here
RELEASE_KEY_ALIAS=production
RELEASE_KEY_PASSWORD=password_here
