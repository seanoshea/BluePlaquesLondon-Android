apply plugin: "com.android.application"
apply plugin: "com.google.gms.google-services"
apply plugin: "com.google.firebase.crashlytics"

// Load local.properties
Properties localProperties = new Properties()
File localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

android {
    signingConfigs {
        //noinspection GroovyMissingReturnStatement
        config {
        }
        production {
            keyAlias localProperties.getProperty('RELEASE_KEY_ALIAS')
            keyPassword localProperties.getProperty('RELEASE_KEY_PASSWORD')
            storeFile file(localProperties.getProperty('RELEASE_STORE_FILE'))
            storePassword localProperties.getProperty('RELEASE_STORE_PASSWORD')
        }
    }
    compileSdkVersion 34
    namespace 'com.upwardsnorthwards.blueplaqueslondon'
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    buildFeatures {
        buildConfig true
        compose true
    }
    
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.3'
    }
    
    lintOptions {
        abortOnError false
        lintConfig file("${project.rootDir}/config/lint/lint.xml")
        htmlReport true
        htmlOutput file("$project.buildDir/reports/lint/lint.html")
    }
    defaultConfig {
        applicationId "com.upwardsnorthwards.blueplaqueslondon"
        minSdkVersion 21
        targetSdkVersion 28
        versionCode 15
        versionName "2.1"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        //noinspection GroovyAssignabilityCheck
        signingConfig signingConfigs.config
        
        // API Keys from local.properties
        buildConfigField "String", "GOOGLE_MAPS_API_KEY", "\"${localProperties.getProperty('GOOGLE_MAPS_API_KEY', '')}\""
        buildConfigField "String", "FABRIC_API_KEY", "\"${localProperties.getProperty('FABRIC_API_KEY', '')}\""
        
        // Add to manifest placeholders
        manifestPlaceholders = [
            googleMapsApiKey: localProperties.getProperty('GOOGLE_MAPS_API_KEY', ''),
            fabricApiKey: localProperties.getProperty('FABRIC_API_KEY', '')
        ]
    }
    buildTypes {
        debug {
            testCoverageEnabled true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            //noinspection GroovyAssignabilityCheck
            signingConfig signingConfigs.production
        }
    }
    productFlavors {
    }
}



dependencies {
    ext.googlePlayServicesVersion = "21.0.1"
    ext.androidBuildToolsVersion = "25.0.0"
    implementation fileTree(dir: "libs", include: ["*.jar"])
    debugImplementation "com.squareup.leakcanary:leakcanary-android:2.12"
    implementation "com.google.firebase:firebase-crashlytics:18.6.1"
    implementation "com.google.firebase:firebase-analytics:21.5.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.annotation:annotation:1.7.0"
    implementation "androidx.multidex:multidex:2.0.1"
    implementation "com.google.android.gms:play-services-maps:18.2.0"
    implementation "com.google.android.gms.play-services-location:21.0.1"
    implementation "com.google.android.gms:play-services-ads:21.5.0"
    implementation "com.google.android.gms:play-services-auth:20.7.0"
    implementation "com.google.firebase:firebase-messaging:23.4.0"
    implementation "com.github.hotchemi:android-rate:1.0.1"
    implementation "androidx.lifecycle:lifecycle-livedata:2.7.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel:2.7.0"
    implementation "org.greenrobot:eventbus:3.3.1"
    implementation "androidx.navigation:navigation-fragment:2.7.5"
    implementation "androidx.navigation:navigation-ui:2.7.5"
    
    // Compose
    def composeBom = platform('androidx.compose:compose-bom:2023.10.01')
    implementation composeBom
    androidTestImplementation composeBom

    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.activity:activity-compose:1.8.0'
    
    // Testing dependencies
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.mockito:mockito-core:5.7.0"
    testImplementation "org.mockito:mockito-inline:5.2.0"
    testImplementation "androidx.test:core:1.5.0"
    testImplementation "org.robolectric:robolectric:4.11.1"
    
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
    androidTestImplementation "androidx.test:runner:1.5.2"
    androidTestImplementation "androidx.test:rules:1.5.0"
    androidTestImplementation "org.mockito:mockito-android:5.7.0"
}
